# AI models configuration
models:
  gemini: "gemini-3.5-flash-lite" # Free-tier Flash model
  gemini_fallback: "gemini-3.1-flash-lite"  # a different Flash-Lite, in case the main one is busy
  groq: "openai/gpt-oss-120b"     # llama-3.3-70b was shut down by Groq on 16 Aug 2026
  groq_fallback: "openai/gpt-oss-20b"

# Data source settings
settings:
  arxiv:
    categories:
      - "cs.AI"
      - "cs.CL"
      - "cs.HC"
      - "cs.LG"
      - "cs.CY"           # Computers and Society: education, health and jobs papers often land here
    days_back: 4          # look back 4 days, so late and weekend papers are not missed
    max_results: 4000     # upper limit of papers per run
    page_size: 1000       # arXiv sends results in pages of this size
    rate_limit_seconds: 3.0
  huggingface:
    daily_papers_url: "https://huggingface.co/api/daily_papers"
  picks_per_day: 6        # roughly one paper per topic

# Morning email (sent with Gmail; the address and app password live in .env / GitHub Secrets)
email:
  from_name: "The Scholar's Desk"
  subject: "The Scholar's Desk · {date} · {count} {papers}"
  signed_by: "Himani Dalvi"
  repo_url: "https://github.com/hixyt/scholars-desk"
  site_url: "https://hixyt.github.io/scholars-desk/"

# Website
site:
  # The Seal Book (hidden on the last page) keeps visitors' seals in a free Supabase table.
  # Both values are public by design: the key is the "publishable" one, never the secret one.
  # Leave them empty and the seal is still pressed, just not kept.
  supabase_url: "https://moflbxuaozrcsqbzrwwt.supabase.co"
  supabase_key: "sb_publishable_i_rqph_yh30-q9mMNSViPQ_WE41UiHu"

  # Subscribe form and the claim checker run on a Supabase Edge Function ("desk").
  # Keep these false until the function is deployed (see SETUP.md), then switch them on.
  subscribe: false
  checker: false

# Claim checker (supabase/functions/desk). Daily caps keep it inside the free Groq and Gemini limits.
checker:
  checks_per_day: 120         # for everyone together
  checks_per_visitor: 8       # per visitor per day
  subscribes_per_visitor: 5   # per visitor per day
  max_claims: 6               # claims taken from one post
